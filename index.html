<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>10А NY</title>
  <link rel="icon" type="image/png" href="images/wreath.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="header">Шапка пупупу</header>
  
    <main class="container">
    <h1>Комната величайшего 10А</h1>
    
    <!-- Обертка для центрирования сцены и кнопки справа -->
    <div class="scene-wrapper">
      
      <!-- Ваш существующий контейнер с основной картинкой (id="scene" сохранен для script.js) -->
      <div class="scene" id="scene">
        <img src="images/main-image.webp" alt="Центральное изображение" class="main-img" id="mainImage">
      </div>

      <!-- Новая картинка справа (венок) -->
      <img src="images/wreath.png" alt="Сменить комнату" class="scene-switch-btn" id="switchSceneBtn">
      
    </div>
  </main>


  <!-- ВСТАВЛЯТЬ ВОТ СЮДА (после </main>) -->
  <section class="new-year-section">
    <h2>до Нового Года:</h2>
    <div class="timer" id="countdown">00д 00ч 00м 00с</div>
  </section>

  <!-- Слой затемнения фона (остается ниже) -->
  <div class="overlay" id="overlay"></div>

  <!-- Выезжающая вкладка справа -->
  <aside class="sidebar" id="sidebar">
    <button class="close-btn" id="closeBtn">✕</button>
    <div class="sidebar-image">
      <img id="sidebarImg" src="images/main-image.webp" alt="Изображение объекта">
    </div>
    <div class="sidebar-desc">
      <h3 id="sidebarTitle">Название объекта</h3>
      <p id="sidebarText">Подробное описание объекта, которое появляется при клике.</p>
    </div>
  </aside>


  <script src="js/script.js"></script>
  <canvas id="snow-canvas"></canvas>

<style>
  #snow-canvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none; /* Снег не мешает кликать по кнопкам и ссылкам */
    z-index: 9999;        /* Поверх остального контента (можно уменьшить, если нужен строго за текстом) */
  }
</style>

<script>
  const canvas = document.getElementById('snow-canvas');
  const ctx = canvas.getContext('2d');

  let width = canvas.width = window.innerWidth;
  let height = canvas.height = window.innerHeight;

  window.addEventListener('resize', () => {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
  });

  // Количество снежинок (оптимально 50–100)
  const flakesCount = 80;
  const flakes = [];

  for (let i = 0; i < flakesCount; i++) {
    flakes.push({
      x: Math.random() * width,
      y: Math.random() * height,
      r: Math.random() * 3 + 1,      // Радиус снежинки (от 1 до 4 px)
      speed: Math.random() * 1 + 0.5, // Скорость падения
      wind: Math.random() * 0.5 - 0.25 // Легкое покачивание по горизонтали
    });
  }

  function drawSnow() {
    ctx.clearRect(0, 0, width, height);
    ctx.fillStyle = 'rgba(255, 255, 255, 0.8)'; // Цвет и прозрачность снега
    ctx.beginPath();

    for (let flake of flakes) {
      ctx.moveTo(flake.x, flake.y);
      ctx.arc(flake.x, flake.y, flake.r, 0, Math.PI * 2);
    }

    ctx.fill();
    moveSnow();
    requestAnimationFrame(drawSnow);
  }

  function moveSnow() {
    for (let flake of flakes) {
      flake.y += flake.speed;
      flake.x += flake.wind;

      if (flake.y > height) {
        flake.y = -5;
        flake.x = Math.random() * width;
      }
    }
  }

  // Учитываем настройки пользователя "меньше анимации"
  if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    drawSnow();
  }
</script>

</body>
</html>
