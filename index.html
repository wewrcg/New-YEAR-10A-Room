<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>10А NY</title>
  <link rel="icon" type="image/png" href="images/wreath.png">

    <!-- Подключение шрифта с Google Fonts -->
<link rel="preconnect" href="https://googleapis.com">
<link rel="preconnect" href="https://gstatic.com" crossorigin>
<link href="https://googleapis.com/css2?family=Mountains+of+Christmas:wght@400;700&display=swap" rel="stylesheet">

  
  <link rel="stylesheet" href="css/style.css">

</head>
<body>

  <header class="header">
  <!-- Персонаж сверху на краю -->
  <img src="images/character.png" alt="Персонаж" class="header-character">
  
  </header>


  
    <main class="container">
    <h1>ROOM of the GREATEST 10А</h1>
    
    
    <!-- Обертка для центрирования сцены и кнопки справа -->
    <div class="scene-wrapper">
  
  <!-- 1. Левый квадратный блок с вашей картинкой -->
  <div class="info-box">
    <img src="images/info.png" alt="Информация">
  </div>

  <!-- 2. Центральная комната -->
  <div class="scene" id="scene">
    <img src="images/main-image.webp" alt="Центральное изображение" class="main-img" id="mainImage">
    <img src="images/initial-image.webp" alt="Второй режим света" class="main-img dark-room-img" id="darkImage">
  </div>


  <!-- 3. Правый блок с венком -->
  <div class="right-controls">
    <img src="images/wreath.png" alt="Переключить свет" class="scene-switch-btn" id="switchSceneBtn" title="Включить / выключить свет">
  </div>
  
</div>

  </main>


  <!-- ВСТАВЛЯТЬ ВОТ СЮДА (после </main>) -->
<section class="new-year-section">
  <div class="ny-banner-wrapper">
    <img src="images/clock.png" alt="Until NEW 2027 Year" class="ny-banner-img">
    <div class="timer" id="countdown">00д 00ч 00м 00с</div>
  </div>
</section>



  <!-- Слой затемнения фона (остается ниже) -->
  <div class="overlay" id="overlay"></div>

  <!-- Выезжающая вкладка справа -->
  <aside class="sidebar" id="sidebar">
    <button class="close-btn" id="closeBtn">✕</button>
    <div class="sidebar-image">
      <img id="sidebarImg" src="images/main-image.webp" alt="Изображение объекта">
    </div>
    <div class="sidebar-desc">
      <h3 id="sidebarTitle">Название объекта</h3>
      <p id="sidebarText">Подробное описание объекта, которое появляется при клике.</p>
    </div>
  </aside>


  <script src="js/script.js"></script>
  <canvas id="snow-canvas"></canvas>

<style>
  #snow-canvas {
    position: absolute;
    top: 0;
    left: 0;
    pointer-events: none;
    z-index: 9999;
  }
</style>

<script>
  const canvas = document.getElementById('snow-canvas');
  const ctx = canvas.getContext('2d');

  // Задаем внутренний размер холста строго равным полной ширине и высоте всей страницы
  function resizeCanvas() {
    canvas.width = document.documentElement.clientWidth;
    canvas.height = document.documentElement.scrollHeight;
  }

  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);
  window.addEventListener('load', resizeCanvas); // Пересчитываем высоту, когда прогрузятся все картинки

  // Увеличили количество снежинок до 130, чтобы их хватило на всю длину страницы
  const flakesCount = 130;
  const flakes = [];

  for (let i = 0; i < flakesCount; i++) {
    flakes.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      r: Math.random() * 3 + 1,
      speed: Math.random() * 1 + 0.5,
      wind: Math.random() * 0.5 - 0.25
    });
  }

  function drawSnow() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
    ctx.beginPath();

    for (let flake of flakes) {
      ctx.moveTo(flake.x, flake.y);
      ctx.arc(flake.x, flake.y, flake.r, 0, Math.PI * 2);
    }

    ctx.fill();
    moveSnow();
    requestAnimationFrame(drawSnow);
  }

  function moveSnow() {
    for (let flake of flakes) {
      flake.y += flake.speed;
      flake.x += flake.wind;

      if (flake.y > canvas.height) {
        flake.y = -5;
        flake.x = Math.random() * canvas.width;
      }
    }
  }

  if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    drawSnow();
  }
</script>


</body>
</html>
